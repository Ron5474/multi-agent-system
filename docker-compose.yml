services:
  bot:
    image: ronp2805/life-os:latest
    command: python bot.py
    env_file: .env
    volumes:
      - memory:/app/memory
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  scheduler:
    image: ronp2805/life-os:latest
    command: python scheduler.py
    env_file: .env
    volumes:
      - memory:/app/memory
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  memory:
